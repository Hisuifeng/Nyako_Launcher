name: 功能建议
description: 希望启动器增加或改进的能力
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        说明使用场景比描述实现方式更有帮助。
  - type: textarea
    id: need
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便，或缺少什么
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代做法
  - type: input
    id: version
    attributes:
      label: 启动器版本（可选）
      placeholder: 0.1.0
